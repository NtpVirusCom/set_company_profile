name: Update SET Companies Data

on:
  schedule:
    - cron: '0 0 * * *'   # 00:00 UTC = 07:00 น. ไทย
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
      
      - name: 🏛️ Fetch SET company list
        run: python scripts/fetch.py
      
      - name: 💰 Fetch dividend data (Yahoo Finance)
        run: python scripts/fetch_dividends.py
      
      # ✅ เพิ่มขั้นตอนนี้
      - name: 🔍 Filter dividend stocks (≥5Y, ≥5%, ≤80% payout)
        run: python scripts/filter_dividends.py
      
      - name: 🚀 Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/
          git diff --staged --quiet || git commit -m "🤖 Auto-update SET & Filtered Dividend data: $(date -u +%Y-%m-%d)"
          git push || true
